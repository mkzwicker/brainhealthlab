backend:
  name: github
  repo: mkzwicker/brainhealthlab
  branch: main

media_folder: "media"
public_folder: "media"

collections:
  - name: "pages"
    label: "Site Content Pages"
    folder: "/"
    extension: "html"
    create: false
    fields:
      - { label: "Site Title", name: "title", widget: "string" }

