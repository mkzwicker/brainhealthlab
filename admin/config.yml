backend:
  name: github
  repo: mkzwicker/brainhealthlab
  branch: main

media_folder: "media"
public_folder: "media"

collections:
  - name: "settings"
    label: "Settings"
    files:
      - file: "_data/settings.yml"
        label: "Site Settings & Branding"
        name: "settings"
        fields:
          - { label: "Lab Title", name: "lab_title", widget: "string", default: "Brain Health Lab" }
          - { label: "Institution Name", name: "institution", widget: "string", default: "St. Francis Xavier University" }
          - { label: "General Contact Email", name: "contact_email", widget: "string", default: "brainhealthlab@stfx.ca" }
          - { label: "Dr. Mazerolle Personal Email", name: "pi_email", widget: "string", default: "emazerol@stfx.ca" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string", default: "https://www.instagram.com/brainhealthlab_stfx/" }
          - { label: "GitHub URL", name: "github_url", widget: "string", default: "https://github.com/brainhealthlabstfx" }

  - name: "home_banner"
    label: "Home/Banner"
    files:
      - file: "_data/home_banner.yml"
        label: "Hero Section Content"
        name: "home_banner"
        fields:
          - { label: "Headline Main Text", name: "headline_text", widget: "string", default: "Interdisciplinary Neuroscience &" }
          - { label: "Headline Accent Text (Pink)", name: "headline_accent", widget: "string", default: "Brain Health Research" }
          - { label: "Subtitle Paragraph 1", name: "subtitle_p1", widget: "text" }
          - { label: "Subtitle Paragraph 2", name: "subtitle_p2", widget: "text" }
          - { label: "Featured Initiatives Carousel", name: "featured_initiatives", widget: "list", fields: [
              { label: "Initiative Title", name: "title", widget: "string" },
              { label: "Description", name: "description", widget: "text" },
              { label: "Link Button Text", name: "link_text", widget: "string" },
              { label: "Link URL", name: "link_url", widget: "string" }
            ]}

  - name: "about"
    label: "About"
    files:
      - file: "_data/about.yml"
        label: "About & Research Areas"
        name: "about"
        fields:
          - { label: "Section Title", name: "section_title", widget: "string", default: "Research Areas" }
          - { label: "Section Subtitle", name: "section_subtitle", widget: "text" }
          - { label: "Research Areas Cards", name: "research_areas", widget: "list", fields: [
              { label: "Card Title", name: "title", widget: "string" },
              { label: "Card Description", name: "description", widget: "text" }
            ]}

  - name: "news"
    label: "News"
    files:
      - file: "_data/news.yml"
        label: "News Articles & Updates"
        name: "news"
        fields:
          - { label: "Section Title", name: "section_title", widget: "string", default: "News" }
          - { label: "Section Subtitle", name: "news_subtitle", widget: "string", default: "Recent updates from our lab and initiatives." }
          - { label: "News Articles", name: "news_items", widget: "list", fields: [
              { label: "Category Badge", name: "category", widget: "string", default: "Update" },
              { label: "Date", name: "date", widget: "string" },
              { label: "Headline", name: "title", widget: "string" },
              { label: "Article Summary", name: "description", widget: "text" },
              { label: "Link Text", name: "link_text", widget: "string" },
              { label: "Link URL", name: "link_url", widget: "string" }
            ]}

  - name: "teaching"
    label: "Teaching"
    files:
      - file: "_data/teaching.yml"
        label: "Teaching & OER Content"
        name: "teaching"
        fields:
          - { label: "Section Title", name: "section_title", widget: "string", default: "Teaching & Open Educational Resources" }
          - { label: "Teaching Overview", name: "teaching_intro", widget: "text" }
          - { label: "Courses Taught", name: "courses", widget: "list", fields: [
              { label: "Course Code", name: "code", widget: "string" },
              { label: "Course Name", name: "title", widget: "string" },
              { label: "Course Description", name: "description", widget: "text" }
            ]}

  - name: "partners"
    label: "Partners"
    files:
      - file: "_data/partners.yml"
        label: "Collaborators & Partners"
        name: "partners"
        fields:
          - { label: "Section Title", name: "section_title", widget: "string", default: "Partners" }
          - { label: "Partners Intro", name: "partners_intro", widget: "text" }
          - { label: "Partners List", name: "partners_list", widget: "list", fields: [
              { label: "Partner Name", name: "name", widget: "string" },
              { label: "Association / Role", name: "association", widget: "string" },
              { label: "Website Link", name: "url", widget: "string" }
            ]}

  - name: "supporters"
    label: "Supporters"
    files:
      - file: "_data/supporters.yml"
        label: "Supporters & Funding Agencies"
        name: "supporters"
        fields:
          - { label: "Section Title", name: "section_title", widget: "string", default: "Supporters & Funding" }
          - { label: "Supporters Intro", name: "supporters_intro", widget: "text" }
          - { label: "Supporters List", name: "supporters_list", widget: "list", fields: [
              { label: "Name / Acronym", name: "name", widget: "string" },
              { label: "Full Organization Name", name: "organization", widget: "string" },
              { label: "Funding Description", name: "description", widget: "text" },
              { label: "Link URL", name: "link", widget: "string" }
            ]}

  - name: "opportunities"
    label: "Opportunities"
    files:
      - file: "_data/opportunities.yml"
        label: "Opportunities & Join Us"
        name: "opportunities"
        fields:
          - { label: "Section Title", name: "section_title", widget: "string", default: "Join Us!" }
          - { label: "Join Us Intro", name: "join_intro", widget: "text" }
          - { label: "Open Opportunities", name: "current_opportunities", widget: "list", fields: [
              { label: "Role Title", name: "role", widget: "string" },
              { label: "Role Description", name: "description", widget: "text" },
              { label: "Requirements", name: "requirements", widget: "string" }
            ]}

  - name: "footer"
    label: "Footer"
    files:
      - file: "_data/footer.yml"
        label: "Footer Content & Contact"
        name: "footer"
        fields:
          - { label: "Footer Note", name: "footer_note", widget: "string", default: "Brain Health Lab @ St. Francis Xavier University" }
          - { label: "Address", name: "address", widget: "text" },
          - { label: "Copyright Year", name: "copyright_year", widget: "string", default: "2026" }
