backend:
  name: github
  repo: mkzwicker/brainhealthlab
  branch: main
local_backend: true
media_folder: "media"
public_folder: "media"

collections:
  - name: "settings"
    label: "Settings"
    files:
      - file: "_data/settings.yml"
        label: "Site Settings"
        name: "settings"
        fields:
          - { label: "Website Title", name: "website_title", widget: "string", default: "Brain Health Lab" }
          - { label: "Lab Title", name: "lab_title", widget: "string" }
          - { label: "Institution", name: "institution", widget: "string" }

  - name: "navigation"
    label: "Navigation"
    files:
      - file: "_data/navigation.yml"
        label: "Navigation Links"
        name: "navigation"
        fields:
          - { label: "Links", name: "links", widget: "list", fields: [
              { label: "Label", name: "label", widget: "string" },
              { label: "Anchor Target", name: "target", widget: "string", hint: "e.g. #about" }
            ]}

  - name: "home_banner"
    label: "Home / Banner"
    files:
      - file: "_data/home_banner.yml"
        label: "Home Banner Content"
        name: "home_banner"
        fields:
          - { label: "Headline Text", name: "headline_text", widget: "string" }
          - { label: "Headline Accent", name: "headline_accent", widget: "string" }
          - { label: "Subtitle Line 1", name: "subtitle_p1", widget: "markdown", required: false }
          - { label: "Subtitle Line 2", name: "subtitle_p2", widget: "markdown", required: false }

  - name: "carousel"
    label: "Featured Carousel"
    files:
      - file: "_data/carousel.yml"
        label: "Featured Carousel"
        name: "carousel"
        fields:
          - { label: "Anchor Name", name: "anchor", widget: "string", hint: "e.g. carousel", required: false }
          - { label: "Title", name: "section_title", widget: "string" }
          - { label: "Introduction", name: "introduction", widget: "markdown", required: false }

  - name: "about"
    label: "About"
    files:
      - file: "_data/about.yml"
        label: "About the Lab"
        name: "about"
        fields:
          - { label: "Anchor Name", name: "anchor", widget: "string", hint: "e.g. about" }
          - { label: "Title", name: "section_title", widget: "string" }
          - { label: "Introduction", name: "introduction", widget: "markdown", required: false }
          - { label: "PI Bio", name: "pi_bio", widget: "markdown", required: false }

  - name: "team"
    label: "Team"
    files:
      - file: "_data/team.yml"
        label: "Team Instructions"
        name: "team"
        fields:
          - { label: "Anchor Name", name: "anchor", widget: "string", hint: "e.g. team" }
          - { label: "Title", name: "section_title", widget: "string" }
          - { label: "Introduction", name: "introduction", widget: "markdown", required: false }
          - { label: "Instructions", name: "instructions", widget: "markdown", default: "To manage Team Members, please edit the [Team Spreadsheet](https://docs.google.com/spreadsheets/d/1hYRIFo5c8reL_e77cofdUBV7eoxFB59P_xxUwWgwRAc/edit#gid=0). Changes will be reflected automatically on the site.", required: false }

  - name: "publications"
    label: "Publications"
    files:
      - file: "_data/publications.yml"
        label: "Publications Instructions"
        name: "publications"
        fields:
          - { label: "Anchor Name", name: "anchor", widget: "string", hint: "e.g. publications" }
          - { label: "Title", name: "section_title", widget: "string" }
          - { label: "Introduction", name: "introduction", widget: "markdown", required: false }
          - { label: "Instructions", name: "instructions", widget: "markdown", default: "To manage Publications, please edit the [Publications Spreadsheet](https://docs.google.com/spreadsheets/d/1mkqwHbvnQgFHCbQjc1pUIXd6v9UuJo5_tbm7Fr2PSYk/edit#gid=0). Changes will be reflected automatically on the site.", required: false }

  - name: "news"
    label: "News"
    files:
      - file: "_data/news.yml"
        label: "News"
        name: "news"
        fields:
          - { label: "Anchor Name", name: "anchor", widget: "string", hint: "e.g. news" }
          - { label: "Title", name: "section_title", widget: "string" }
          - { label: "Introduction", name: "introduction", widget: "markdown", required: false }

  - name: "teaching"
    label: "Teaching"
    files:
      - file: "_data/teaching.yml"
        label: "Teaching"
        name: "teaching"
        fields:
          - { label: "Anchor Name", name: "anchor", widget: "string", hint: "e.g. teaching" }
          - { label: "Title", name: "section_title", widget: "string" }
          - { label: "Introduction", name: "introduction", widget: "markdown", required: false }

  - name: "partners"
    label: "Partners"
    files:
      - file: "_data/partners.yml"
        label: "Partners Instructions"
        name: "partners"
        fields:
          - { label: "Anchor Name", name: "anchor", widget: "string", hint: "e.g. partners" }
          - { label: "Title", name: "section_title", widget: "string" }
          - { label: "Introduction", name: "introduction", widget: "markdown", required: false }
          - { label: "Instructions", name: "instructions", widget: "markdown", default: "To manage Collaborators/Partners, please edit the [Collaborators Spreadsheet](https://docs.google.com/spreadsheets/d/1Y6qGA40KcuQUxagPOT8wLDZxOYE3SUc_qQjr1X_Ir1U/edit#gid=0). Changes will be reflected automatically on the site.", required: false }

  - name: "supporters"
    label: "Supporters"
    files:
      - file: "_data/supporters.yml"
        label: "Supporters"
        name: "supporters"
        fields:
          - { label: "Anchor Name", name: "anchor", widget: "string", hint: "e.g. supporters" }
          - { label: "Title", name: "section_title", widget: "string" }
          - { label: "Introduction", name: "introduction", widget: "markdown", required: false }

  - name: "opportunities"
    label: "Opportunities"
    files:
      - file: "_data/opportunities.yml"
        label: "Opportunities"
        name: "opportunities"
        fields:
          - { label: "Anchor Name", name: "anchor", widget: "string", hint: "e.g. join-us" }
          - { label: "Title", name: "section_title", widget: "string" }
          - { label: "Introduction", name: "introduction", widget: "markdown", required: false }

  - name: "footer"
    label: "Footer"
    files:
      - file: "_data/footer.yml"
        label: "Footer Settings"
        name: "footer"
        fields:
          - { label: "Address Line 1", name: "address_line_1", widget: "string" }
          - { label: "Address Line 2", name: "address_line_2", widget: "string" }
          - { label: "Address Line 3", name: "address_line_3", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Google Scholar Link", name: "scholar_link", widget: "string", required: false }
          - { label: "GitHub Link", name: "github_link", widget: "string", required: false }
          - { label: "Instagram Link", name: "instagram_link", widget: "string", required: false }
