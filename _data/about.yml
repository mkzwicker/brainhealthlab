anchor: "about"
section_title: "Research Areas"
introduction: "Our laboratory integrates community-engaged outreach, clinical brain imaging translation, and reproducible neuroscience methods."
pi_bio: |
  Dr. Erin Mazerolle is an Associate Professor in the <a href="https://www.stfx.ca/academics/science/psychology" target="_blank" rel="noopener noreferrer">Department of Psychology</a> at St. Francis Xavier University in Antigonish, Nova Scotia, where she is cross-appointed to the <a href="https://www.stfx.ca/academics/science/computer-science" target="_blank" rel="noopener noreferrer">Department of Computer Science</a> and <a href="https://www.stfx.ca/academics/science/biology" target="_blank" rel="noopener noreferrer">Department of Biology</a>.

  Erin holds an adjunct appointment in the <a href="https://www.dal.ca/faculty/science/psychology_neuroscience.html" target="_blank" rel="noopener noreferrer">Department of Psychology and Neuroscience</a> at Dalhousie University, is an Affiliate Member of <a href="https://www.uvic.ca/socialsciences/psychology/" target="_blank" rel="noopener noreferrer">Psychology at the University of Victoria</a>, and a Scientific Affiliate (Research) of <a href="https://www.nshealth.ca/" target="_blank" rel="noopener noreferrer">Nova Scotia Health</a>.
research_areas:
  - title: "Brain Health Literacy"
    description: "Improving brain health literacy through community-engaged research, interactive educational tools, and open access learning materials."
  - title: "Clinical Translation"
    description: "Translating cutting-edge functional brain imaging and vascular biomarker techniques directly into clinical patient care."
  - title: "Reproducibility"
    description: "Improving the reproducibility, open data pipelines, and methodological rigor of functional brain imaging research."
