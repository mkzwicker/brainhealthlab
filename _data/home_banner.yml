headline_text: "Interdisciplinary Neuroscience &"
headline_accent: "Brain Health Research"
subtitle_p1: "The Brain Health Lab @ StFX is a research group led by Dr. Erin Mazerolle."
subtitle_p2: "Our team of collaborators and trainees advance brain science, health, and literacy through diverse perspectives and backgrounds combining education, psychology, health, biology, computer science, chemistry, engineering, physics, neuropsychology, and neurology."
featured_initiatives:
  - title: "Maintaining Brains Project"
    description: "Lifestyle changes could delay or prevent 45% of cognitive impairment. We co-created interactive tools and community resources to share research on brain health!"
    link_text: "Visit Maintaining Brains Site"
    link_url: "https://brainhealthlabstfx.github.io/MaintainingBrainsGame/"
  - title: "Antigonish Brain Bee"
    description: "Annual neuroscience competition for students in grades 9–12 across Nova Scotia, fostering youth STEM engagement and brain literacy!"
    link_text: "Follow Brain Bee Instagram"
    link_url: "https://www.instagram.com/antigonishbrainbee/"
  - title: "Open Educational Resources"
    description: "Developing open textbooks, lab manuals (supported by AtlanticOER), and open course materials in statistics, cognitive neuroscience, and neuroimaging."
    link_text: "Explore OERs & Teaching"
    link_url: "#teaching"
