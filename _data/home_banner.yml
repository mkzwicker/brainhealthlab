subtitle_p1: The **Brain Health Lab** is a research group led by <a href="#pi-profile" class="text-brand-darkPink font-extrabold hover:text-brand-pink focus:outline-none transition-colors">Dr. Erin Mazerolle</a> at [St. Francis Xavier University](https://www.stfx.ca/).
subtitle_p2: Our team of collaborators and trainees advance neuroscience, brain health, and brain health literacy.
